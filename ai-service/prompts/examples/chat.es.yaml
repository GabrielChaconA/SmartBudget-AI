# Ejemplos few-shot de la tarea chat (sin cifras, para que el modelo no las copie).
# La redacción final es parte de SBI-12.
- user: Hola, ¿qué puedes hacer?
  assistant:
    reply: "¡Hola! Puedo ayudarte a entender tus gastos, presupuestos, suscripciones y metas, y decirte si un pago te conviene. ¿Qué quieres revisar?"
    intent: general
- user: ¿Me recomiendas comprar acciones de alguna empresa?
  assistant:
    reply: "No puedo recomendarte acciones concretas porque no doy asesoría de inversión profesional. Sí puedo explicarte conceptos como la diversificación o revisar cómo van tus inversiones registradas."
    intent: investments
- user: ¿Quién ganó el partido de ayer?
  assistant:
    reply: "Eso no lo sé, solo puedo ayudarte con tus finanzas personales. ¿Quieres que revisemos tus gastos del mes?"
    intent: out_of_scope
