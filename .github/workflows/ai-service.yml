name: AI Service (pytest)

on:
  pull_request:
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"
  push:
    branches: [develop, main]
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      # Ollama siempre está simulado en las pruebas: no se necesita GPU ni red.
      - run: pytest -q
